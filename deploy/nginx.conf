# Serves the built React dashboard and proxies API + MCP to the backend service.
# Same-origin proxy means no CORS config is needed in production.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Baseline security headers.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # SECURITY: this stack has NO built-in authentication and the API can write
    # files and (if enabled) run model-authored code. If you expose it beyond your
    # own machine, put auth in front of it. Uncomment to require a password:
    #   auth_basic           "loopfund";
    #   auth_basic_user_file /etc/nginx/.htpasswd;   # created with: htpasswd -c .htpasswd user

    # SPA: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Dashboard REST API.
    location /api/ {
        proxy_pass http://backend:8500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;   # cycles can run minutes
    }

    # MCP streamable-HTTP endpoint (remote MCP clients connect here).
    location /mcp {
        proxy_pass http://mcp:8600/mcp;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
    }
}
